name: Isolated Debian PXE boot

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture filter
        type: choice
        options: [both, amd64, arm64]
        default: both
      variant:
        description: Distribution to exercise
        type: choice
        default: both
        options:
          - both
          - apt
          - docker
      raid_level:
        description: GPT RAID recipe for the amd64 APT client
        type: choice
        options: ['1', '5', '1-lvm']
        default: '1'

permissions:
  contents: read
jobs:
  hyperv-fixture-binary:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.label.name == 'ci:hyperv-fixture-binary' || github.event.label.name == 'ci:linux-pxe-media')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PXE_SOURCE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PXE_SOURCE }}
          persist-credentials: false
      - name: Build the test binary natively for the PXE server
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$PXE_SOURCE"
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 build --locked --release --manifest-path rust/Cargo.toml
          fixture="$RUNNER_TEMP/pxe-hyperv-fixture"
          install -D -m 0755 rust/target/release/pxe-tools-rust "$fixture/pxe-tools-rust"
          strip "$fixture/pxe-tools-rust"
          cd "$fixture"
          sha256sum pxe-tools-rust > SHA256SUMS
          printf '%s\n' "$PXE_SOURCE" > source-commit.txt
      - name: Verify Linux and Windows installer menus in an isolated network namespace
        run: |
          sudo unshare --net /bin/bash -ec '
            ip link set lo up
            for address in 192.0.2.1 192.0.2.10 192.0.2.11 198.51.100.10; do
              ip addr add "$address/32" dev lo
            done
            python3 tests/integration/test_rust_windows_editions.py rust/target/release/pxe-tools-rust
          '
      - name: Prepare the verified Ubuntu Server ISO using the normal image pipeline
        if: github.event.label.name == 'ci:linux-pxe-media'
        run: |
          set -euo pipefail
          fixture=$(mktemp -d "$RUNNER_TEMP/ubuntu-pxe-media.XXXXXXXX")
          trap 'sudo rm -rf -- "$fixture"' EXIT
          if ! command -v 7z >/dev/null || ! command -v sqlite3 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full sqlite3
          fi
          sqlite3 "$fixture/db.sqlite" < app/db/schema.sqlite.sql
          sqlite3 "$fixture/db.sqlite" "INSERT INTO os_images
            (id,distro,version,version_full,arch,codename,extract_method,enabled,status,iso_url)
            VALUES (1,'ubuntu','24.04.5','24.04.5','amd64','noble','iso_extract',1,'downloading',
                    'https://releases.ubuntu.com/24.04/ubuntu-24.04.5-live-server-amd64.iso');"
          mkdir "$fixture/http"
          sudo env HTTP_ROOT="$fixture/http" PXE_APP_DIR="$PWD/app" PXE_DB_DRIVER=sqlite \
            PXE_DB_PATH="$fixture/db.sqlite" UBUNTU_CD_KEYRING="$PWD/docker/pxe-tools/keyrings/pxe-ubuntu-cd.gpg" \
            PXE_RUST_GUIDED=1 IMAGE_ID=1 bash docker/worker/scripts/bootstrap-download-image-iso.sh
          prepared="$fixture/http/netboot/ubuntu/24.04.5/amd64"
          for file in linux initrd.gz source.iso; do
            test -s "$prepared/$file"
          done
          printf '%s  %s\n' 97f3d7ffb032c3eb3b23d2c8be9cc76e60c2c1f2c0146ba5ba9fe01cafae0fd8 \
            "$prepared/source.iso" | sha256sum --check
          expected=$(stat --format=%s "$prepared/source.iso" "$prepared/linux" "$prepared/initrd.gz" | awk '{size += $1} END {printf "%.0f\n",size}')
          test "$(sqlite3 "$fixture/db.sqlite" 'SELECT status || char(32) || size_bytes FROM os_images WHERE id=1')" = "downloaded $expected"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event.label.name == 'ci:hyperv-fixture-binary'
        with:
          name: pxe-hyperv-rust-amd64
          path: ${{ runner.temp }}/pxe-hyperv-fixture/
          if-no-files-found: error
          retention-days: 1

  first-boot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.label.name == 'ci:pxe-debian' || github.event.label.name == 'ci:pxe-raid-lvm'
        || github.event.label.name == 'ci:rust-distributions'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64, variant: apt}
          - {runner: ubuntu-24.04, arch: amd64, variant: docker}
          - {runner: ubuntu-24.04-arm, arch: arm64, variant: apt}
          - {runner: ubuntu-24.04-arm, arch: arm64, variant: docker}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 85
    env:
      PXE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      PXE_ARCH: ${{ matrix.arch }}
      PXE_VARIANT: ${{ matrix.variant }}
      PXE_NATIVE_ONLY: ${{ github.event.label.name == 'ci:rust-distributions' }}
      PXE_RAID_LEVEL: ${{ github.event.label.name == 'ci:pxe-raid-lvm' && '1-lvm' || inputs.raid_level || '1' }}
      PXE_VARIANT_SELECTED: >-
        ${{ (github.event.label.name != 'ci:pxe-raid-lvm' && inputs.raid_level != '1-lvm'
             || (matrix.arch == 'amd64' && matrix.variant == 'apt'))
             && (github.event_name != 'workflow_dispatch'
             || ((inputs.architecture == 'both' || inputs.architecture == matrix.arch)
             && (inputs.variant == 'both' || inputs.variant == matrix.variant))) }}
    steps:
      - name: Validate the exact revision
        if: env.PXE_VARIANT_SELECTED == 'true'
        run: '[[ "$PXE_SOURCE" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: env.PXE_VARIANT_SELECTED == 'true'
        with:
          ref: ${{ env.PXE_SOURCE }}
          persist-credentials: false
      - name: Check for hardware acceleration
        if: env.PXE_VARIANT_SELECTED == 'true'
        id: kvm
        run: |
          if test -c /dev/kvm; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            if [ "$PXE_NATIVE_ONLY" = 'true' ]; then
              echo 'No KVM on this runner. Only the fresh distribution install will be tested.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Build the requested guided distribution and fixture tools
        if: env.PXE_VARIANT_SELECTED == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PXE_SOURCE"
          case "$PXE_ARCH" in amd64) test "$(uname -m)" = x86_64 ;; arm64) test "$(uname -m)" = aarch64 ;; esac
          inputs=$(mktemp -d "$RUNNER_TEMP/guided-rust.XXXXXXXX")
          image="pxe-native-e2e-${PXE_SOURCE:0:10}:local"
          appliance="pxe-guided-${PXE_SOURCE:0:10}:local"
          fresh="pxe-fresh-${PXE_SOURCE:0:10}:local"
          if [ "$PXE_VARIANT" = apt ]; then
            rustup toolchain install 1.96.0 --profile minimal
            cargo +1.96.0 build --locked --release --manifest-path rust/Cargo.toml
            strip rust/target/release/pxe-tools-rust
            python3 packaging/native/build-apt-package-candidate.py "$inputs/native.deb" --architecture "$PXE_ARCH" \
              --version '0.1.0~guided1' --rust-binary rust/target/release/pxe-tools-rust \
              --maintainer 'PXE Tools <security@pxetools.com>'
            dpkg-deb --field "$inputs/native.deb" Package Version Architecture Depends
            test "$(stat -c %s "$inputs/native.deb")" -le 26214400
            stat -c 'Guided .deb: %s bytes' "$inputs/native.deb"
            docker build --platform "linux/$PXE_ARCH" --target fresh --tag "$fresh" -f - "$inputs" <<'DOCKERFILE'
          FROM debian:13-slim AS fresh
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates systemd systemd-sysv && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
            if [ "$PXE_NATIVE_ONLY" != 'true' ] || [ "$PXE_HAS_KVM" = 'true' ]; then
              docker build --platform "linux/$PXE_ARCH" --tag "$image" -f - "$inputs" <<'DOCKERFILE'
          FROM debian:13-slim
          COPY native.deb /var/tmp/native.deb
          RUN apt-get update && apt-get install -y --no-install-recommends /var/tmp/native.deb systemd-sysv qemu-system-x86 qemu-utils socat && rm -f /var/tmp/native.deb && rm -rf /var/lib/apt/lists/*
          RUN ! dpkg-query -W -f='${Status}' php8.4-fpm 2>/dev/null | grep -q 'install ok installed'
          DOCKERFILE
            fi
          else
            docker build --platform "linux/$PXE_ARCH" --target rust-guided -f docker/pxe-tools/Dockerfile \
              --build-arg 'APP_VERSION=0.1.0~guided1' --label "org.opencontainers.image.revision=$PXE_SOURCE" \
              --tag "$appliance" .
            docker image inspect -f 'Guided image: {{.Os}}/{{.Architecture}} {{.Size}} bytes' "$appliance"
            if [ "$PXE_NATIVE_ONLY" != 'true' ] || [ "$PXE_HAS_KVM" = 'true' ]; then
              docker build --platform "linux/$PXE_ARCH" --tag "$image" - <<'DOCKERFILE'
          FROM debian:13-slim
          RUN apt-get update && apt-get install -y --no-install-recommends debian-archive-keyring ca-certificates cpio gpgv curl dnsmasq-base python3 qemu-system-x86 qemu-utils socat && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
            fi
          fi
          {
            echo "PXE_NATIVE_PXE_IMAGE=$image"
            echo "PXE_RUST_GUIDED_DOCKER_IMAGE=$appliance"
            echo "PXE_FRESH_APT_IMAGE=$fresh"
            echo "PXE_GUIDED_DEB=$inputs/native.deb"
          } >> "$GITHUB_ENV"
        env:
          PXE_HAS_KVM: ${{ steps.kvm.outputs.available }}
      - name: Install the fresh APT or Docker candidate and verify the Rust console
        if: env.PXE_VARIANT_SELECTED == 'true'
        run: bash tests/integration/test_rust_fresh_distribution.sh "$PXE_VARIANT"
      - name: Verify Rust console, worker and PHP parity
        if: env.PXE_VARIANT_SELECTED == 'true' && matrix.arch == 'amd64' && matrix.variant == 'apt' && env.PXE_RAID_LEVEL == '1'
        run: |
          set -euo pipefail
          docker build --tag pxe-rust-parity:local - <<'DOCKERFILE'
          FROM debian:13-slim
          RUN apt-get update && apt-get install -y --no-install-recommends nginx openssl openssh-client php-cli php-fpm php-sqlite3 python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --workdir /workspace pxe-rust-parity:local /bin/bash -ec '
              python3 tests/benchmarks/rust-monitor/parity.py
              python3 tests/integration/test_rust_initial_setup.py
            '
      - name: Install Debian from PXE and verify first boot with PHP-FPM stopped
        if: >-
          env.PXE_VARIANT_SELECTED == 'true' &&
          (github.event.label.name != 'ci:rust-distributions' || steps.kvm.outputs.available == 'true')
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends tesseract-ocr
          if [ ! -c /dev/net/tun ]; then
            sudo install -d /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo -- env PXE_NATIVE_PXE_TEST=1 PXE_NATIVE_PXE_ARCH="$PXE_ARCH" PXE_NATIVE_PXE_BACKEND="rust-$PXE_VARIANT" \
            PXE_NATIVE_PXE_RAID_LEVEL="$PXE_RAID_LEVEL" \
            PXE_NATIVE_PXE_IMAGE="$PXE_NATIVE_PXE_IMAGE" PXE_RUST_GUIDED_DOCKER_IMAGE="$PXE_RUST_GUIDED_DOCKER_IMAGE" \
            PYTHONUNBUFFERED=1 python3 tests/integration/test_native_discovery_install_chain_isolated.py
