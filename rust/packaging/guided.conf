proxy_set_header X-Pxe-Client-Ip $remote_addr;
proxy_intercept_errors off;
proxy_next_upstream off;

location = /preseed.php {
    proxy_pass http://unix:/run/pxe-tools-rust-guided/http.sock:;
}

location = /grub.php {
    proxy_pass http://unix:/run/pxe-tools-rust-guided/http.sock:;
}

location ^~ /api/ {
    proxy_pass http://unix:/run/pxe-tools-rust-guided/http.sock:;
}

location ^~ /pxe/postboot/ {
    proxy_pass http://unix:/run/pxe-tools-rust-guided/http.sock:;
}

# Static locations must never serve generated PHP source or private scripts.
location ~* \.php(?:/|$) { return 404; }
location = /wipe.sh { return 404; }
location ^~ /postboot/ { return 404; }
