location = /api/monitoring/installs {
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Pxe-Client-Ip $remote_addr;
    proxy_pass http://unix:/run/pxe-tools-rust-monitor/http.sock:;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @pxe_monitor_php;
}

location @pxe_monitor_php {
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    fastcgi_param DOCUMENT_ROOT /app/public;
    include fastcgi_params;
}
