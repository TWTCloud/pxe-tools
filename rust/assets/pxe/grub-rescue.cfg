menuentry '$label' {
    echo 'Démarrage du mode récupération...'
    insmod efinet
    insmod tftp
    insmod http
    $signal
    linux  ($proto,$orch_ip)/netboot/$default_distro/$default_arch/linux $kernel_opts rescue/enable=true
    initrd ($proto,$orch_ip)/netboot/$default_distro/$default_arch/initrd.gz ($proto,$orch_ip)/netboot/$default_distro/$default_arch/firmware.cpio.gz
}
